<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ css_path | default('style.css') }}">
</head>
<body>
  <header class="site-header"><span class="brand">Kenyon CGE &mdash; Admin</span></header>
  <main>
    {% set flash = request.query_params.get("flash") %}
    {% if flash %}<p class="flash" role="status">{{ flash }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer><small>IPHS 400 Mini-Project #2</small></footer>
</body>
</html>
