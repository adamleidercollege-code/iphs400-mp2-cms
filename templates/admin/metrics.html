{% extends "admin/console_base.html" %}
{% block console_content %}
  <h1>Metrics</h1>
  <h2>Posts per Program</h2>
  {% if rows %}
    <ul>
      {% for row in rows %}
        <li>{{ row.program.title }}: {{ row.count }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No Programs exist yet.</p>
  {% endif %}
{% endblock %}
