{% extends "base.html" %}
{% block content %}
  <h1>Change role &mdash; {{ target.display_name }}</h1>
  <p>{{ target.email }}, currently {{ target.role_label }}.</p>
  <form method="post" action="edit">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Role
      <select name="role">
        {% for value, label in roles %}
          <option value="{{ value }}" {% if value == target.role %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">Save role</button>
  </form>
  <p><a href="../../accounts">Cancel</a></p>
{% endblock %}
