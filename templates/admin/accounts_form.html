{% extends "admin/console_base.html" %}
{% block console_content %}
  <h1>{{ title }}</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="new">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email <input type="email" name="email" value="{{ form_email }}" required></label>
    <label>Display name <input type="text" name="display_name" value="{{ form_display_name }}" required></label>
    <label>Password <input type="password" name="password" required></label>
    <label>Role
      <select name="role">
        {% for value, label in roles %}
          <option value="{{ value }}" {% if value == form_role %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">Create account</button>
  </form>
{% endblock %}
