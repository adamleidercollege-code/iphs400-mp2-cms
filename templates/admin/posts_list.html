{% extends "base.html" %}
{% block content %}
  <h1>Posts &mdash; {{ program.title }}</h1>
  <p><a href="posts/new?program_id={{ program.id }}">New post</a></p>
  <ul>
    {% for post in posts %}
      <li>
        {{ post.title }} ({{ post.topic }}, {{ post.status }})
        <a href="posts/{{ post.id }}/edit">edit</a>
        <a href="posts/{{ post.id }}/delete">delete</a>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
